<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d49c4"/>
      <stop offset="0.55" stop-color="#5a2e93"/>
      <stop offset="1" stop-color="#452070"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a678ea"/>
      <stop offset="1" stop-color="#7a49c9"/>
    </linearGradient>
  </defs>

  <!-- remote body -->
  <rect x="76" y="14" width="104" height="228" rx="27" fill="url(#body)" stroke="#2a1647" stroke-width="3"/>
  <rect x="82" y="20" width="92" height="104" rx="21" fill="url(#gloss)"/>

  <!-- top row: power, info, instant replay -->
  <circle cx="102" cy="48" r="11" fill="#cb3b30"/>
  <path d="M98.6 44.6 A6.2 6.2 0 1 0 105.4 44.6" fill="none" stroke="#ffffff" stroke-width="2.1" stroke-linecap="round"/>
  <line x1="102" y1="42.4" x2="102" y2="48.2" stroke="#ffffff" stroke-width="2.1" stroke-linecap="round"/>
  <circle cx="128" cy="48" r="10" fill="#b79ae0"/>
  <circle cx="154" cy="48" r="10" fill="#b79ae0"/>

  <!-- d-pad -->
  <circle cx="128" cy="126" r="46" fill="#2a1647"/>
  <circle cx="128" cy="126" r="39" fill="#3d2266"/>
  <polygon points="128,90 139,104 117,104" fill="#ffffff"/>
  <polygon points="128,162 117,148 139,148" fill="#ffffff"/>
  <polygon points="92,126 106,115 106,137" fill="#ffffff"/>
  <polygon points="164,126 150,137 150,115" fill="#ffffff"/>
  <circle cx="128" cy="126" r="15" fill="url(#ok)" stroke="#e6d7ff" stroke-width="2.4"/>

  <!-- playback row: rewind, play, fast forward -->
  <circle cx="102" cy="196" r="9.5" fill="#b79ae0"/>
  <circle cx="128" cy="196" r="11.5" fill="#dccdfa"/>
  <circle cx="154" cy="196" r="9.5" fill="#b79ae0"/>

  <!-- bottom: app shortcut tiles -->
  <rect x="90" y="218" width="32" height="12" rx="6" fill="#b79ae0" opacity="0.85"/>
  <rect x="134" y="218" width="32" height="12" rx="6" fill="#b79ae0" opacity="0.55"/>
</svg>
